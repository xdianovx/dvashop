server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt {
        access_log off;
        log_not_found off;
        rewrite ^ /index.php last;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Internal-only search gateway: nginx's asynchronous resolver bounds Docker DNS
# failures even when the Meilisearch container is stopped. No host port is exposed.
server {
    listen 7701;
    server_name _;
    access_log off;
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 250ms;

    location / {
        set $search_backend http://meilisearch:7700;
        proxy_pass $search_backend;
        proxy_connect_timeout 250ms;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
